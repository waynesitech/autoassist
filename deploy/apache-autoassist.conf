# Apache2 virtual host for https://autoassist.com.my
# - /           → frontend (main site from frontend/dist)
# - /admin      → admin dashboard (admin/dist)
# - /api        → backend API (proxy to Node)
# - /static     → backend static files (proxy to Node)
# - /phpmyadmin → phpMyAdmin (Debian apache.conf; install phpmyadmin package)
#
# CRITICAL: This must be the ONLY site handling autoassist.com.my.
# If / still redirects to /admin, another site is serving the domain (e.g. default)
# or this file was not fully applied. See deploy/README.md "Troubleshooting".
#
# Required: a2enmod rewrite proxy proxy_http headers ssl
# Copy to /etc/apache2/sites-available/autoassist.com.my.conf
# Then: sudo a2ensite autoassist.com.my.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName autoassist.com.my
    Redirect permanent / https://autoassist.com.my/
</VirtualHost>

<VirtualHost *:443>
    ServerName autoassist.com.my

    # SSL: configure paths to your certs (e.g. Let's Encrypt)
    # SSLEngine on
    # SSLCertificateFile     /etc/letsencrypt/live/autoassist.com.my/fullchain.pem
    # SSLCertificateKeyFile  /etc/letsencrypt/live/autoassist.com.my/privkey.pem

    # --- ROOT (/) MUST serve FRONTEND, not admin ---
    DocumentRoot /var/www/autoassist/frontend/dist
    <Directory /var/www/autoassist/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
        Header set X-AutoAssist-Site "frontend"
    </Directory>

    # Proxy and Alias first so they take precedence over default DocumentRoot
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3002/api/
    ProxyPassReverse /api/ http://127.0.0.1:3002/api/
    ProxyPass /static/ http://127.0.0.1:3002/static/
    ProxyPassReverse /static/ http://127.0.0.1:3002/static/

    # phpMyAdmin: map /phpmyadmin to the package install. Without this, FallbackResource
    # on the frontend DocumentRoot would serve index.html for /phpmyadmin (SPA, not phpMyAdmin).
    # Install: sudo apt install phpmyadmin && ensure PHP is enabled for Apache (e.g. libapache2-mod-php).
    # If apache2ctl configtest reports duplicate Alias, disable the global conf: sudo a2disconf phpmyadmin
    IncludeOptional /etc/phpmyadmin/apache.conf

    # Admin only at /admin (never at /)
    Alias /admin /var/www/autoassist/admin/dist
    <Directory /var/www/autoassist/admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /admin/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /admin/index.html [L]
        Header set X-AutoAssist-Site "admin"
    </Directory>

    # Redirect /admin (no trailing slash) to /admin/
    RewriteEngine On
    RewriteRule ^/admin$ /admin/ [R=301,L]

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>

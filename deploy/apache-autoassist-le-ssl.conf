# Replace the content of /etc/apache2/sites-available/autoassist.com.my-le-ssl.conf with this.
# That file is the one actually serving https://autoassist.com.my (certbot made it first).
#
# There must be NO "Redirect ... /admin" or "RewriteRule ^/$ ... /admin" in this vhost,
# or the root URL will keep redirecting to /admin. If you still get 302 to /admin,
# run: sudo grep -n "Redirect|RewriteRule" .../autoassist.com.my-le-ssl.conf and remove that line.
#
# Backup first: sudo cp /etc/apache2/sites-available/autoassist.com.my-le-ssl.conf .../autoassist.com.my-le-ssl.conf.bak
# Then replace the file content with this entire block (keep SSL paths if they differ).

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName autoassist.com.my
    ServerAlias www.autoassist.com.my

    # SSL (certbot usually adds these)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/autoassist.com.my/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/autoassist.com.my/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # --- ROOT (/) serves FRONTEND, not admin ---
    DocumentRoot /var/www/autoassist/frontend/dist
    <Directory /var/www/autoassist/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
        Header set X-AutoAssist-Site "frontend"
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3002/api/
    ProxyPassReverse /api/ http://127.0.0.1:3002/api/
    ProxyPass /static/ http://127.0.0.1:3002/static/
    ProxyPassReverse /static/ http://127.0.0.1:3002/static/

    # phpMyAdmin at /phpmyadmin (see deploy/apache-autoassist.conf comments)
    IncludeOptional /etc/phpmyadmin/apache.conf

    Alias /admin /var/www/autoassist/admin/dist
    <Directory /var/www/autoassist/admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteBase /admin/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /admin/index.html [L]
        Header set X-AutoAssist-Site "admin"
    </Directory>

    RewriteEngine On
    RewriteRule ^/admin$ /admin/ [R=301,L]

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
</IfModule>

# Nginx config for https://autoassist.com.my
# - /           → frontend (main site from frontend/dist)
# - /admin      → admin dashboard (admin/dist)
# - /api        → backend API (proxy to Node)
# - /static     → backend static files (proxy to Node)
#
# Copy to /etc/nginx/sites-available/ and symlink from sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name autoassist.com.my;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autoassist.com.my;

    # SSL: configure paths to your certs (e.g. Let's Encrypt)
    # ssl_certificate     /etc/letsencrypt/live/autoassist.com.my/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/autoassist.com.my/privkey.pem;

    # Main site: frontend at / (built from frontend folder)
    location / {
        root /var/www/autoassist/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Admin dashboard at /admin only (do not serve admin at root)
    location /admin/ {
        alias /var/www/autoassist/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 $scheme://$host/admin/;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend static files (e.g. uploads)
    location /static/ {
        proxy_pass http://127.0.0.1:3002/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Optional: security / caching headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
